[project]
name = "goodix-fingerprint-drivers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Space-Dev0", email = "179112172+Space-Dev0@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "crccheck>=1.3.1",
    "crcmod>=1.7",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pycryptodome>=4.1.0",
    "python-periphery>=2.4.3",
    "pyusb>=1.3.1",
    "spidev>=3.8",
]

[project.scripts]
goodix-fingerprint-drivers = "goodix_fingerprint_drivers:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
